name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Decide whether to deploy
        id: changes
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          deploy=true
          if [ "$EVENT" = push ] && files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA"); then
            echo "$files"
            echo "$files" | grep -qE '^(apps/agent/|docs/agent-prompt\.md$|package\.json$|package-lock\.json$|\.github/workflows/ci\.yml$)' || deploy=false
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  deploy:
    needs: test
    if: needs.test.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/agent
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write the Worker secrets file
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::The CLOUDFLARE_API_TOKEN secret isn't visible to this repo."; exit 1; }
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::The ANTHROPIC_API_KEY secret isn't visible to this repo."; exit 1; }
          jq -n '{ANTHROPIC_API_KEY: env.ANTHROPIC_API_KEY}' > "$RUNNER_TEMP/worker-secrets.json"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply handup --remote

      - name: Deploy the Worker
        run: npx wrangler deploy --secrets-file "$RUNNER_TEMP/worker-secrets.json"
